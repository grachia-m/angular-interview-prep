<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f1eadf" />
    <meta name="description" content="Adaptive interview training for Angular 16–22." />
    <title>Angular Interview Prep</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-view" data-i18n="skip.main">Skip to main content</a>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation" data-i18n-aria="nav.label">
        <a class="brand" href="#today" data-nav="today" aria-label="Angular Interview Prep" data-i18n-aria="app.name">
          <span class="brand-mark" aria-hidden="true">∠</span>
          <span><strong>Angle</strong><small data-i18n="app.subtitle">Modern practice workspace</small></span>
        </a>

        <nav class="side-nav" aria-label="Primary navigation" data-i18n-aria="nav.label">
          <button class="nav-item is-active" type="button" data-nav="today"><span>01</span><span data-i18n="nav.today">Today</span></button>
          <button class="nav-item" type="button" data-nav="practice"><span>02</span><span data-i18n="nav.practice">Practice</span></button>
          <button class="nav-item" type="button" data-nav="lookup"><span>03</span><span data-i18n="nav.lookup">Quick lookup</span></button>
          <button class="nav-item" type="button" data-nav="mock"><span>04</span><span data-i18n="nav.mock">Mock interview</span></button>
          <button class="nav-item" type="button" data-nav="saved"><span>05</span><span data-i18n="nav.saved">Saved &amp; mistakes</span></button>
          <button class="nav-item" type="button" data-nav="progress"><span>06</span><span data-i18n="nav.progress">Progress</span></button>
        </nav>

        <div class="sidebar-note">
          <span class="signal-dot" aria-hidden="true"></span>
          <div><small data-i18n="shell.mode">Angular mode</small><strong id="sidebar-mode">Mixed</strong></div>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div class="topbar-copy">
            <p class="eyebrow" data-i18n="shell.daily">Daily Angular practice</p>
            <h1 id="page-title">Today</h1>
          </div>

          <div class="topbar-actions">
            <button class="lookup-trigger" type="button" data-action="open-lookup">
              <span aria-hidden="true">⌕</span> <span data-i18n="nav.lookup">Quick lookup</span> <kbd>⌘ K</kbd>
            </button>

            <label class="version-picker">
              <span>Angular</span>
              <select id="version-mode" aria-label="Angular version" data-i18n-aria="controls.version">
                <option value="mixed" data-i18n="controls.mixed">Mixed</option>
                <option value="16">16</option>
                <option value="17">17</option>
                <option value="18">18</option>
                <option value="19">19</option>
                <option value="20">20</option>
                <option value="21">21</option>
                <option value="22">22</option>
              </select>
            </label>

            <label class="focus-toggle">
              <input id="modern-focus" type="checkbox" aria-label="Modern focus" data-i18n-aria="controls.modernFocusAria" />
              <span class="toggle-track" aria-hidden="true"><span></span></span>
              <span data-i18n="controls.modernFocus">Modern Focus</span>
            </label>

            <label class="locale-control">
              <span class="visually-hidden" data-i18n="controls.locale">Language</span>
              <select id="locale-select" aria-label="Language" data-i18n-aria="controls.locale">
                <option value="en">EN</option>
                <option value="ru">RU</option>
                <option value="es">ES</option>
              </select>
            </label>
          </div>
        </header>

        <main id="main-view" tabindex="-1">
          <div id="view" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <nav class="mobile-nav" aria-label="Primary navigation" data-i18n-aria="nav.label">
      <button class="is-active" type="button" data-nav="today" data-i18n="nav.today">Today</button>
      <button type="button" data-nav="practice" data-i18n="nav.practice">Practice</button>
      <button type="button" data-nav="lookup" data-i18n="nav.lookup">Quick lookup</button>
      <button type="button" data-nav="mock" data-i18n="nav.mock">Mock interview</button>
      <button type="button" data-nav="saved" data-i18n="nav.saved">Saved &amp; mistakes</button>
      <button type="button" data-nav="progress" data-i18n="nav.progress">Progress</button>
    </nav>

    <dialog id="lookup-dialog" class="lookup-dialog" aria-labelledby="lookup-title">
      <div class="dialog-head">
        <div>
          <p class="eyebrow" data-i18n="lookup.title">Quick lookup</p>
          <h2 id="lookup-title" data-i18n="lookup.subtitle">Find the concept without leaving your workout.</h2>
        </div>
        <button class="icon-button" type="button" data-action="close-lookup" aria-label="Close quick lookup" data-i18n-aria="lookup.close">×</button>
      </div>
      <label class="lookup-search">
        <span aria-hidden="true">⌕</span>
        <input id="lookup-input" type="search" placeholder="Try “signals”, “switchMap”, “hydration”…" data-i18n-placeholder="lookup.placeholder" aria-label="Search Angular, RxJS, or NgRx" data-i18n-aria="lookup.label" autocomplete="off" />
        <kbd>esc</kbd>
      </label>
      <div id="lookup-results" class="lookup-results"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./assets/app.js"></script>
  </body>
</html>
